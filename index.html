<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="pass">
        <div class="container">
            <form action="">
                <input class="input" type="password" placeholder="password" name="" id="">
                <div class="btn">

                    <button class="close"><iconify-icon icon="mdi:eye-off-outline" width="24"
                            height="24"></iconify-icon></button>
                    <button class="open"><iconify-icon icon="majesticons:eye-line" width="24"
                            height="24"></iconify-icon></button>
                </div>
            </form>
        </div>
    </section>

    <section class="dark_light">
        <div class="container">
            <h2 class="head">Switch Dark Theme</h2>
            <div class="theme_btn">
                <button class="moon"><iconify-icon icon="si:moon-fill" width="24" height="24"></iconify-icon></button>
                <button class="sun"><iconify-icon icon="mingcute:sun-fill" width="24" height="24"></iconify-icon></button>
            </div>
        </div>
    </section>
    <script src="app.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
</body>

</html>
